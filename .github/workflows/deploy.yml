name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # --- CI JOB: Test & Validate Code (Runs on PRs and Pushes) ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install HTMLHint (Linter)
        run: npm install -g htmlhint

      - name: Run HTML Validation
        run: htmlhint index.html

      - name: Test Secure Secret
        env:
          MY_API_KEY: ${{ secrets.MY_API_KEY }}
        run: |
          echo "Checking secret..."
          echo "API Key loaded successfully!"

  # --- BUILD JOB: Prepare & Package Assets + Docker Registry Push ---
  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Build / Optimization
        run: |
          echo "Running build process..."
          mkdir -p public
          cp index.html public/
          # Future optimization commands (like CSS minification) go here

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/learncicd-app:latest

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  # --- CD JOB: Deploy to GitHub Pages (Runs ONLY when merged/pushed to main) ---
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4